# Provisional science decisions. Validate and calibrate for each instrument.
[heuristics]
reference_model = "central_tiles"
evidence_model = "single_scale"
# Detector family (user decision D5): "background_v2" (default) is the
# source-masked background/noise model with two-sided evidence, source
# protection and illumination-anchored boundaries; "tile_v1" is the legacy
# tile baseline. Optional [heuristics.v2] keys: input/doc/configuration.md.
# v2 thresholds are registered values validated on synthetic data only.
detector = "background_v2"
tile_size = 16
minimum_border_tiles = 2
minimum_abs_z_score = 8.0
maximum_tile_noise_ratio = 0.20
minimum_spatial_correlation = 0.95
minimum_mask_fraction = 0.005
maximum_mask_fraction = 0.50

# Clip-versus-keep tradeoff. These are diagnostic evidence units, not probabilities.
minimum_evidence_ratio = 1.25
maximum_evidence_ratio = 5.0
valid_pixel_loss_cost = 1.5
minimum_net_utility = 0.001
# Crop policy (plan Revision 3, selected on the synthetic policy grid; not
# calibrated on observatory data). Crop mode retains detector-flagged samples
# as data, so its residual ceiling is zero: a crop never keeps flagged pixels.
# crop_masked writes retained flags undefined, so it may enlarge the rectangle
# over up to 5% flagged pixels (omitted: uses the crop-mode ceiling).
maximum_residual_artifact_fraction = 0.0
crop_masked_residual_fraction = 0.05
# Valid-pixel sacrifice cap (fraction of unflagged defined pixels discarded).
# An optional [heuristics.crop_sacrifice_fraction_by_border_component_count]
# table (one/two/three/four_or_more) overrides it per border-area count.
maximum_crop_sacrifice_fraction = 0.10
# Exchange rate (plan R4.1): accept a crop only if sacrificed unflagged pixels
# <= rate * flagged pixels removed. 0.5 = at most one valid pixel per two
# artifact pixels. Omitted = not applied.
crop_exchange_rate = 0.5
# Crop-mode action when no rectangle passes the gates (user decision D1):
# "keep" (legacy default when omitted), "mask", or "bbox_mask" = crop to the
# tight bounding box of retained unflagged samples and mark flags undefined.
crop_fallback = "bbox_mask"
