# Provisional science decisions. Validate and calibrate for each instrument.
[heuristics]
reference_model = "central_tiles"
evidence_model = "single_scale"
tile_size = 16
minimum_border_tiles = 2
minimum_abs_z_score = 8.0
maximum_tile_noise_ratio = 0.20
minimum_spatial_correlation = 0.95
minimum_mask_fraction = 0.005
maximum_mask_fraction = 0.50

# Clip-versus-keep tradeoff. These are diagnostic evidence units, not probabilities.
minimum_evidence_ratio = 1.25
maximum_evidence_ratio = 5.0
valid_pixel_loss_cost = 1.5
minimum_net_utility = 0.001
# Provisional crop-only ceiling: flagged defined pixels retained / defined pixels in crop.
maximum_residual_artifact_fraction = 0.05
maximum_crop_sacrifice_fraction = 0.35 # fallback for older files without the area-count table.
# Crop-mode action when no rectangle passes the gates (user decision D1):
# "keep" (legacy default when omitted), "mask", or "bbox_mask" = crop to the
# tight bounding box of retained unflagged samples and mark flags undefined.
crop_fallback = "bbox_mask"
# Optional exchange rate (plan R4.1, opt-in): accept a crop only if sacrificed
# unflagged pixels <= rate * flagged pixels removed. Omitted = not applied.
# crop_exchange_rate = 1.0

[heuristics.crop_sacrifice_fraction_by_border_component_count]
one = 0.35
two = 0.35
three = 0.35
four_or_more = 0.47
