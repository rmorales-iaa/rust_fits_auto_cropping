[package]
name = "fits-auto-clipping"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Conservative border artifact detection and masking for single-HDU FITS images"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fitskit = "0.3.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
